name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apartman-capacitor

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v5

      - name: Node.js beállítása
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java (JDK 21) beállítása
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Függőségek telepítése
        run: npm install

      - name: Android platform hozzáadása (ha még nincs)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor szinkronizálás
        run: npx cap sync android
      - name: Widget beillesztése
        run: python3 widget/install_widget.py
      - name: APK fordítása
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK feltöltése letöltéshez
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: apartman-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
