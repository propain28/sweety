name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java (JDK 17) beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Hiányzó Capacitor alapok pótlása és telepítés
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            mkdir -p www
            cp *.html *.css *.js www/ 2>/dev/null || true
            npx cap init "SajatApp" "com.sajat.app" --web-dir=www
          fi

      - name: Android platform hozzáadása (ha még nincs)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor szinkronizálás
        run: npx cap sync android

      - name: APK fordítása
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK feltöltése letöltéshez
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
